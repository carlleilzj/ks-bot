# ============================================================
# 非敏感配置。敏感信息（token/key）请写在 .env 里。
# ============================================================

# 轮询 Instagram 新作品的间隔（分钟）。官方 API 无风控压力，可适当调小
poll_interval_min: 15

# 本地 faster-whisper 附加选项（ASR_PROVIDER=local 时生效）
asr:
  local_device: auto      # auto / cpu
  local_compute: int8     # int8 / int8_float16 / float16

# 字幕烧录样式（ratio 均为相对视频尺寸的比例，自动适配竖屏/横屏）
subtitle:
  enabled: true
  # 字体在本机不存在时会自动回退（PingFang SC → Hiragino Sans GB → Heiti SC）
  font: PingFang SC
  font_size_ratio: 0.045  # 字号 = 视频宽 * 0.045
  outline_ratio: 0.006    # 描边宽度
  margin_v_ratio: 0.07    # 距底部距离 = 视频高 * 0.07
  bold: true

# 二创变换（抖音「原创性不足」对策）
# 平台查重比对画面帧特征 + 音频波形 + 关键帧哈希。只转码+去元数据时
# 成片逐像素等于源片，判搬运一眼的事。开启后每条片子按下面区间随机取值，
# 参数独立 —— 固定模板批量产出反而会被判「同质化发布」。
transform:
  enabled: true
  crop_pct: [0.02, 0.05]     # 四边裁切比例（改构图，同时改帧哈希）
  zoom_pct: [1.02, 1.06]     # 放大后裁回原尺寸
  hflip_prob: 0.0            # 水平镜像概率（0 = 关闭：镜像后文字反着看很怪，2026-10-03 应要求停用）
  hue_deg: [-4.0, 4.0]       # 色相偏移（度）
  sat: [0.96, 1.06]
  bright: [-0.03, 0.03]
  contrast: [0.97, 1.05]
  fps: [29.5, 30.0]          # 微改帧率，打乱关键帧抽取
  tempo: [0.97, 1.03]        # 语速/音调微调（音频指纹，±3% 听不出）
  crf: [19, 24]              # 码率随机，避免固定编码指纹

# AI 画面质检开关
# 2026-09-16 起改为「手动发链接」模式：素材由人工筛选，真人检测已无必要。
# real_person_check: false = 完全停用真人检测（发现层不再丢弃真人候选、
#                            转码层不再跳过真人镜头），视频照常走完流水线。
# real_person_check: true  = 恢复真人检测（上方 discovery.filters.reject_real_person
#                            也需为 true 才会在发现层生效）。
vision:
  real_person_check: false

# 水印擦除（烧录在画面像素里的固定位置水印，用 ffmpeg delogo 取周边像素插值填充）
# 注意：只能擦固定位置水印；delogo 需重编码视频，画质有轻微损失。
# 坐标 [x, y, w, h]：数值全 <=1 视为相对比例（推荐，自动适配任意分辨率）。
watermark:
  enabled: false          # 默认关闭；确认素材确实带烧录水印再打开
  box: 1                  # delogo 采样边框宽度，1 最轻、越大越糊
  presets: []             # 预置区域：top_left / bottom_right / corner_pair / douyin
  # 自定义区域（与 presets 叠加生效）
  regions: []
  # 示例（左上角圆形 Logo + 右下角账号名水印，IMILASHA 这类素材的典型布局）：
  # presets: ["corner_pair"]

# 发布节奏（窗口全局；每日上限和最小间隔按平台独立计算，互不影响）
# 2026-10-29 增长调整（数据依据：10-18 点各时段中位播放持平 931~1184，
# 晚黄金档样本向上；日发 5+ 条摊薄账号流量池）：集中在晚黄金档高频短间隔。
publish:
  headless: true            # 后台无头浏览器；首次调试发布流程建议改 false 观察操作
  daily_limit: 6            # 每个平台每天最多发布条数（19:00 起每 30 分钟 1 条，6 条收在 21:30）
  min_gap_hours: 0.5        # 同一平台两次发布之间的最小间隔（小时）
  window: ["19:00", "22:00"] # 允许发布的时间窗口，窗口外排队等待（支持跨夜，如 ["20:00","06:00"]）

# 发布平台开关。新平台先 python -m bot.main --login <平台> 扫码登录，再把 enabled 改 true
platforms:
  kuaishou:
    enabled: true
    spark_task: true            # 发布时挂星火「关联变现任务」（需先在 App 收藏任务）
    # spark_task_title 留空 = 按收益加权轮换（权重见 bot/publish/kuaishou.py
    # 的 SPARK_TASK_WEIGHTS）；填子串 = 固定只挂该任务
    # 收益归因报告：python -m bot.monitor.spark_income --report
    anchors:
      热点: "治愈"
      地点: "郴州"
      声明: "内容由AI生成"        # 作者声明；下拉若为「内容为AI生成」亦匹配

  # 第二个快手号（矩阵号）：链接里写 @快手2 才发（不进默认队列）。
  # 登录：/login 快手2（或 /login kuaishou2）→ TG 推扫码，登录态 ks2_state.json。
  # 星火池/收益快照按号独立文件，与上面 A 号互不影响。
  # 标题/话题按画面自适应（bot/ai/copywriter.py 的 kuaishou2 profile）。
  kuaishou2:
    enabled: true
    default: false              # 只有显式 @快手2 才发，绝不占默认队列
    daily_limit: 6              # 与 A 号相同节奏（晚黄金档 30 分钟 1 条）
    min_gap_hours: 0.5          # 覆盖全局，与 A 号一致
    spark_task: false           # B 号 App 里收藏星火任务后再改 true
    anchors:
      声明: "内容由AI生成"
  douyin:
    enabled: false
    # 发布时自动挂载「添加标签」（留空则跳过）。
    # 2026-09-22 改版：添加标签是搜索框，直接搜全国可挂的商品（不绑门店）。
    # 类型「商品/团购/标记万物」走搜索框；「位置」仍走旧下拉（门店，不全国）。
    anchors:
      商品: "抽纸"              # 全国日用商品；auto/全国 也会落到抽纸
      # 位置: "上海"           # 门店推广，绑定本地，不用
      # 小程序: "sslocal://..."
    hot_topic: "搞笑"          # 关联热点：自动搜该词并选第一个热点
  xhs:
    enabled: false   # 账号风控被限制发布，暂停；解封后改回 true
  weixin:
    enabled: false    # 2026-10-12 再次暂停：上传 300001 风控复发（10-10 恢复后发了 6 条），待解除后改回 true
  toutiao:
    enabled: true      # 可用，但**不默认发布**：链接里写 @头条/@toutiao 才发
    default: false     # 2026-10-15 起：按需投，不占默认队列
    anchors:
      声明: "AI生成"  # 素材是 AI 动画；页面文案就是「AI生成」

# 各平台可选分区列表（发布页有分区选择的平台才需要；抖音/小红书无分区，用话题标签）
# LLM 会从中选择一个；列表与实际不符时自动降级为不选分类
platform_categories:
  kuaishou:
    # 按实测分区播放排序（2026-10-29，A 号 89 条）：情感(中位3058) >
    # 萌宠(1262) > 搞笑(897)。治愈解压向内容优先选情感/萌宠，靠前的更可能被 LLM 选中
    - 情感
    - 萌宠
    - 生活记录
    - 亲子
    - 美食
    - 搞笑
    - 健康
    - 教育
    - 三农
    - 知识
    - 影视娱乐
  # 快手2号（女性生活号）：分区按女性内容排（时尚置前；
  # 实际页面若无「时尚」选项，_select_category 失败不阻断，自动跳过）
  kuaishou2:
    - 时尚
    - 生活记录
    - 情感
    - 亲子
    - 美食
    - 知识
    - 旅游
    - 音乐
    - 时尚穿搭
    - 舞蹈
    - 游戏
    - 运动
    - 汽车
    - 科技数码
    - 二次元
