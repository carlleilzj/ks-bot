# ============================================================
# 非敏感配置。敏感信息（token/key）请写在 .env 里。
# ============================================================

# 轮询 Instagram 新作品的间隔（分钟）。官方 API 无风控压力，可适当调小
poll_interval_min: 15

# 本地 faster-whisper 附加选项（ASR_PROVIDER=local 时生效）
asr:
  local_device: auto      # auto / cpu
  local_compute: int8     # int8 / int8_float16 / float16

# 发现层全局参数（各平台的寻源配置在 platforms.<name>.discover）
discovery:
  # 待发水位闸门（2026-11-12）：已就绪但未发出的量（READY 任务 / PENDING job 取大者）
  # 达到该值就跳过本轮自动发现，积压消化到水位以下自动恢复。
  # 依据：发布产能 = 快手 A/B 各 daily_limit 6 条 = 12 条/天，而发现层入库
  # 约 21-31 条/天，净积压约 +15/天。24 = 约两天的产能缓冲。
  # 设为 0 可关闭闸门（恢复“无条件按 interval 发现”的旧行为）。
  backlog_watermark: 24
  # 出海链路单独的水位（2026-11-12 新增）。
  # 不能与国内共用 24：国内快手积压一旦顶到 24，就会把出海寻源一起关掉，
  # 而出海 4 账号产能是 2×4=8 条/天（窗口 20:00~06:00），24 条对它等于 3 天库存。
  # 8 = 约一天的产能缓冲。
  backlog_watermark_overseas: 8

# 字幕烧录样式（ratio 均为相对视频尺寸的比例，自动适配竖屏/横屏）
subtitle:
  enabled: true
  # 字体在本机不存在时会自动回退（PingFang SC → Hiragino Sans GB → Heiti SC）
  font: PingFang SC
  font_size_ratio: 0.045  # 字号 = 视频宽 * 0.045
  outline_ratio: 0.006    # 描边宽度
  margin_v_ratio: 0.07    # 距底部距离 = 视频高 * 0.07
  bold: true

# 二创变换（抖音「原创性不足」对策）
# 平台查重比对画面帧特征 + 音频波形 + 关键帧哈希。只转码+去元数据时
# 成片逐像素等于源片，判搬运一眼的事。开启后每条片子按下面区间随机取值，
# 参数独立 —— 固定模板批量产出反而会被判「同质化发布」。
transform:
  enabled: true
  crop_pct: [0.02, 0.05]     # 四边裁切比例（改构图，同时改帧哈希）
  zoom_pct: [1.02, 1.06]     # 放大后裁回原尺寸
  hflip_prob: 0.0            # 水平镜像概率（0 = 关闭：镜像后文字反着看很怪，2026-10-03 应要求停用）
  hue_deg: [-4.0, 4.0]       # 色相偏移（度）
  sat: [0.96, 1.06]
  bright: [-0.03, 0.03]
  contrast: [0.97, 1.05]
  fps: [29.5, 30.0]          # 微改帧率，打乱关键帧抽取
  tempo: [0.97, 1.03]        # 语速/音调微调（音频指纹，±3% 听不出）
  crf: [19, 24]              # 码率随机，避免固定编码指纹

# AI 画面质检开关
# 2026-09-16 起改为「手动发链接」模式：素材由人工筛选，真人检测已无必要。
# real_person_check: false = 完全停用真人检测（发现层不再丢弃真人候选、
#                            转码层不再跳过真人镜头），视频照常走完流水线。
# real_person_check: true  = 恢复真人检测（上方 discovery.filters.reject_real_person
#                            也需为 true 才会在发现层生效）。
vision:
  real_person_check: false

# 水印擦除（烧录在画面像素里的固定位置水印，用 ffmpeg delogo 取周边像素插值填充）
# 注意：只能擦固定位置水印；delogo 需重编码视频，画质有轻微损失。
# 坐标 [x, y, w, h]：数值全 <=1 视为相对比例（推荐，自动适配任意分辨率）。
watermark:
  enabled: false          # 默认关闭；确认素材确实带烧录水印再打开
  box: 1                  # delogo 采样边框宽度，1 最轻、越大越糊
  presets: []             # 预置区域：top_left / bottom_right / corner_pair / douyin
  # 自定义区域（与 presets 叠加生效）
  regions: []
  # 示例（左上角圆形 Logo + 右下角账号名水印，IMILASHA 这类素材的典型布局）：
  # presets: ["corner_pair"]

# 发布节奏（窗口全局；每日上限和最小间隔按平台独立计算，互不影响）
# 2026-11-02 回退（数据：19-22 点满 48h 样本 n=10 中位 248，10-18 点 n=35 中位 660；
# 改动后中位 928→279）。6 条挤 2.5 小时同账号自相竞争、流量池被分摊；
# 恢复全天分散 + 2 小时间隔（10/12/14/16/18/20 六条）。
publish:
  headless: true            # 后台无头浏览器；首次调试发布流程建议改 false 观察操作
  daily_limit: 6            # 每个平台每天最多发布条数（间隔 2h，全天分散）
  min_gap_hours: 2          # 同一平台两次发布之间的最小间隔（小时）
  window: ["10:00", "22:00"] # 允许发布的时间窗口，窗口外排队等待（支持跨夜，如 ["20:00","06:00"]）

# 发布平台开关。新平台先 python -m bot.main --login <平台> 扫码登录，再把 enabled 改 true
platforms:
  kuaishou:
    enabled: true
    # 自动素材发现（2026-11-09）：替代人工投链。
    # 只发现「链接」，候选仍走原有流水线（去重 → 下载 → 转码 → 文案 → 发布），
    # 不另造一套下载逻辑。
    discover:
      # 2026-11-11 定位纯化：【纯粹 AI / 3D 搞笑脑洞动画】（对齐 ig_anim）
      # 彻底剔除实拍萌宠/纯动物标签与关键词，避免实拍猫狗混入挤占动画池
      enabled: true
      interval_hours: 6
      per_query: 8
      per_run: 8
      min_short_side: 540       # 拦掉 360p/480p 超低清糊片，保留 576x1024 及以上动画
      require_vertical: false   # A 号保留 1920x1080 皮克斯风宽屏动画电影
      min_likes: 30             # 拦掉 0 赞无人问津死片（24h 内新帖豁免）
      max_age_days: 540         # 只取近一年半作品，拒绝 2020 年陈年老古董
      sources: []               # 关键词搜索走 IG，不用 yt-dlp 搜索
      # IG 话题：严格对齐 IG · 3D/AI 动画，抓纯 3D/CGI/AI 动画短片
      ig_tags:
        - 3danimation
        - aianimation
        - blender3d
        - cgi
        - animatedshort
        - 3dcartoon
        - pixarstyle
        - 3D动画
        - AI动画
        - 搞笑动画
        - 脑洞动画
      ig_keywords:
        - 3d animation short
        - ai animation funny
        - cgi animated short
        - 3D 搞笑动画
        - AI 脑洞动画
      ig_limit_per_entry: 24
      # 旧的 YouTube 查询词，保留备查（sources 为空时不生效）
      queries:
        - "3d animation short #shorts"
        - "ai animation funny #shorts"
        - "cgi animated short #shorts"
        - "3D 脑洞动画"
      # 题材闸门：严格要求出现动画/CG/AI 形态特征词（绝不因 cat/dog/搞笑 放行实拍）
      require_any:
        - 3d
        - animation
        - animated
        - cgi
        - blender
        - cartoon
        - pixar
        - dragon
        - dino
        - ai
        - 动画
        - 卡通
        - 3D
        - 神反转
        - 脑洞
        - 恐龙
        - 神龙
      block_any:
        - makeup tutorial
        - cooking recipe
        - news report
        - pc build
        - pet
        - pets
        - puppy
        - kitten
        - catsofinstagram
        - dogsofinstagram
        - real life
        - 化妆教程
        - 新闻报道
        - 采访街访
        - 实拍
        - 宠物日常
        - 萌宠日常
    # 2026-11-10 取消全部变现挂载（用户核验快手 App 收益账单）：
    #   累计收益 248.23 元中：星火 208.10 元、磁力万合 40.13 元，磁力聚星近 30 天收益为 0.00 元！
    #   短剧 CPS 需要用户充值转化，搞笑萌宠受众与短剧完全割裂，转化率为 0；
    #   挂载反而被打上商业营销标签压制自然推荐池，还抑制了磁力万合的自然播放分成。
    #   与 B 号一致，彻底取消挂载，回归纯公域自然流，吃磁力万合纯播放收益。
    #   代码侧判定：attach_service 为空且 spark_task 为 false → 整段挂载逻辑跳过。
    attach_service: ""
    attach_prefer: ""
    attach_fallback: ""
    cover_title: false           # 2026-11-02 关闭 A 号封面大字报（与窗口同批上线无法归因，先撤）
    spark_task: false            # 星火已下架；留着字段便于日后星火恢复
    # spark_task_title 留空 = 按收益加权轮换（权重见 bot/publish/kuaishou.py
    # 的 SPARK_TASK_WEIGHTS）；填子串 = 固定只挂该任务
    # 收益归因报告：python -m bot.monitor.spark_income --report
    anchors:
      热点: "治愈"
      地点: "郴州"
      声明: "内容由AI生成"        # 作者声明；下拉若为「内容为AI生成」亦匹配

  # 第二个快手号（矩阵号）：链接里写 @快手2 才发（不进默认队列）。
  # 登录：/login 快手2（或 /login kuaishou2）→ TG 推扫码，登录态 ks2_state.json。
  # 星火池/收益快照按号独立文件，与上面 A 号互不影响。
  # 标题/话题按画面自适应（bot/ai/copywriter.py 的 kuaishou2 profile）。
  kuaishou2:
    enabled: true
    default: false              # 只有显式 @快手2 才发，绝不占默认队列
    # 自动素材发现：B 号是家居号，**必须做题材过滤**。
    # 2026-11-09 真实数据：10-24~11-02 床品占 71%，11-03 之后掉到 45%，
    # 修眉/女鞋/电竞房混进来 27%。人工挑会漂，这里用关键词挡在入库之前。
    discover:
      enabled: true
      interval_hours: 6
      per_query: 8
      per_run: 6
      whitelist_require_genre: true # 2026-11-11：白名单账号也必须命中床品/睡衣关键词，防杂货铺跑偏
      min_short_side: 720           # 严格 >=720p 高清，杜绝 360x640 / 540p 低清糊片
      require_vertical: true        # 强制原生竖屏 9:16，拒绝 4:5/1:1/4:3 糊底变形片（如 720x900 鱼缸）
      min_likes: 30                 # 拒绝 0~3 赞死片（24h 内新帖豁免）
      max_age_days: 540             # 拒绝 2020 年陈年僵尸广告
      # 2026-11-09 停用 YouTube 搜索：用户反馈优质内容少。
      # 实测 YouTube 搜「cozy bedroom decor」返回的多是 5~25 分钟教程/测评
      # 或 Amazon 联盟推广；而 IG 白名单（harun_home 等）拿到的是真实家纺
      # 卖家的实拍，题材和质量都更对口。
      # 现在 B 号靠：白名单 IG 账号 + IG hashtag/关键词搜索。
      sources: []
      # ---- 带货定位（2026-11-09 用户明确）----
      # B 号以后要带货，主带**四件套**和**女性睡衣**。
      # 所以采集要按这两个品类收窄，不再收「泛家居」：
      # 窗帘/沙发/地毯/靠垫这些不是我们的 SKU，收进来只会稀释账号标签。
      # hashtag 选标签时也遵循这个原则 —— 见下方两段注释。
      #
      # 【四件套 / 床品套件】优先
      ig_tags:
        - 四件套
        - 床品
        - 床上用品
        - 家纺
        - 被套
        - 床单
        - bedding
        - duvetcover
        - beddingset
        - bedsheets
        - linens
        # 【女性睡衣】
        - 睡衣
        - 家居服
        - 睡裙
        - 冰丝睡衣
        - 珊瑚绒睡衣
        - pajamas
        - pyjamas
        - sleepwear
        - loungewear
        - nightwear
      # IG 关键词搜索（与 hashtag 互补：hashtag 是「主动打标签」，
      # 关键词是「平台按内容匹配」，两者结果集不完全重合）
      ig_keywords:
        - 四件套
        - 毛绒四件套
        - 纯棉四件套
        - 冰丝四件套
        - 睡衣 女
        - 睡裙 女
        - 珊瑚绒睡衣
        - duvet cover set
        - bedding set
        - satin pajamas
      # 每个入口最多取多少条链接（实测一屏约 24 条）
      ig_limit_per_entry: 24
      # 每个入口翻几页。1 = 24 条，2 ≈ 40+ 条。
      # IG 的 hashtag 页没有时间排序参数（实测 GraphQL variables 只有
      # query/after/first），是推荐排序 —— 所以翻页拿到的不是「更新」
      # 而是「更多」，对带货选品反而更合适（要的是好素材，不是最新）。
      ig_pages: 2
      # 查询词必须带 #shorts 或 short —— 实测不带后缀时 YouTube 返回的多是
      # 5~25 分钟的教程/测评（2026-11-09 诊断：6 条里 5 条时长 500s+ 被丢），
      # 带 #shorts 后 8 条里 5 条是 20 秒内的竖屏短视频。
      # 中文查询实测最准：「四件套 床品 卧室」6/6 全过（8~59s，全是真家纺）。
      # 中英文混用：英文扩覆盖面，中文吃精准垂类。
      queries:
        - "cozy bedroom decor #shorts"
        - "fluffy bedding duvet #shorts"
        - "bedroom makeover #shorts"
        - "home bedding aesthetic #shorts"
        - "四件套 床品 卧室"
        - "床上用品 开箱 展示"
        - "四件套 开箱"
        - "床上用品 推荐 舒适"
        - "毛绒四件套 冬天"
        - "床品 换季 卧室"
        - "卧室改造 软装"
        - "床单 被套 测评"
        - "宿舍床品 布置"
        - "家纺 床品 好物"
        - "卧室布置 温馨"
        - "冬季 加厚 被子"
        - "枕头 靠垫 卧室"
        - "窗帘 卧室 搭配"
        - "沙发 靠垫 客厅软装"
        - "睡衣 家居服 舒适"
      # 标题/描述必须命中其一 —— 这是 B 号的题材闸门。
      #
      # 2026-11-09 按带货定位收窄：只认**四件套/床品套件**和**女性睡衣**。
      # 之前收录的 curtain/rug/sofa/cushion（窗帘/地毯/沙发/靠垫）
      # 不属于要卖的 SKU，已移除 —— 收进来会稀释账号标签，
      # 也让「家居」这个垂类变得不聚焦。
      #
      # ⚠️ 多语言是必须的：B 号历史数据 24% 来自阿拉伯语家居号
      # （هارون هوم n=8 中位 3206 是最好的源），1 个俄语号，实测还有
      # 日语/西班牙语/韩语内容。只配中英文会把非英语卖家全排除。
      require_any:
        # ---- 英文：床品套件 ----
        - bedding
        - duvet
        - bed sheet
        - bedsheet
        - sheet set
        - quilt
        - comforter
        - duvet cover
        - pillowcase
        - blanket
        - linen
        # ---- 英文：睡衣 ----
        - pajama
        - pyjama
        - sleepwear
        - loungewear
        - nightwear
        - nightgown
        # ---- 阿拉伯语：床品 ----
        - لحاف          # 被子/羽绒被
        - شرشف          # 床单
        - مفارش         # 床品套件
        - أغطية         # 被套（复数）
        - غطاء سرير     # 床罩（限定，避免 غطاء 单用太泛）
        - بطانية        # 毯子
        - وسادة         # 枕头
        - تطريز         # 高端刺绣床品（如 grandstyle_egypt）
        # ---- 阿拉伯语：睡衣 ----
        - بيجامة        # 睡衣
        - بجامه         # 睡衣（方言拼写）
        - دراعة         # 居家丝绒睡裙/长袍
        - دشداشة        # 家居睡裙/长袍
        - تراك          # 家居休闲套装
        - قميص نوم      # 睡裙/睡衣上衣
        # ---- 俄语：床品 ----
        - постель       # 床品
        - одеяло        # 被子
        - простыня      # 床单
        - наволочка     # 枕套
        # ---- 俄语：睡衣 ----
        - пижама        # 睡衣
        - ночная        # 睡裙（ночная рубашка）
        # ---- 日语：床品 ----
        - 布団カバー    # 被套
        - シーツ        # 床单
        - 枕カバー      # 枕套
        - 掛け布団      # 被子
        - 寝具          # 寝具
        # ---- 日语：睡衣 ----
        - パジャマ      # 睡衣
        - ルームウェア  # 家居服
        - ナイティ      # 睡裙
        # ---- 西班牙语：床品 ----
        - sabana        # 床单
        - funda nórdica # 被套
        - edredon       # 羽绒被
        - almohada      # 枕头
        # ---- 西班牙语：睡衣 ----
        - pijama        # 睡衣
        - camison       # 睡裙
        # ---- 韩语：床品 ----
        - 이불          # 被子
        - 베갯잇        # 枕套
        - 침구          # 寝具
        # ---- 韩语：睡衣 ----
        - 파자마        # 睡衣
        - 잠옷          # 睡衣
        # ---- 中文：四件套 ----
        - 四件套
        - 床品
        - 被套
        - 床单
        - 枕套
        - 家纺
        - 被芯
        - 床盖
        # ---- 中文：睡衣 ----
        - 睡衣
        - 睡裙
        - 家居服
        - 睡袍
        - 睡裤
      # 命中即丢弃，优先级高于 require_any。
      # 用途1：挡住「在卧室里化妆」这类 require 会命中、但题材完全不相关的内容。
      # 用途2：挡住带货/推广视频 —— YouTube 上大量「fluffy duvet」视频其实是
      #        Amazon 联盟推广（caption 里带 SHOP: amzn.to 或 Check price on
      #        Amazon），2026-11-09 实测混进来 3 条。这类内容自带外链与促销话术，
      #        直接发到快手有违规风险，而且不是真实使用体验。
      block_any:
        - makeup
        - eyebrow
        - skincare
        - gaming room
        - gaming setup
        - pc build
        - minecraft
        - 修眉
        - 化妆
        - 护肤
        - 电竞
        - 游戏
        - amzn.to
        - amazon
        - check price
        - shop now
        - "shop:"
        - "buy link"
        - affiliate
        - promo code
        - discount code
        - order now
        - in our shop
