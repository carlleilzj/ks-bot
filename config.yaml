# ============================================================
# 非敏感配置。敏感信息（token/key）请写在 .env 里。
# ============================================================

# 轮询 Instagram 新作品的间隔（分钟）。官方 API 无风控压力，可适当调小
poll_interval_min: 15

# 本地 faster-whisper 附加选项（ASR_PROVIDER=local 时生效）
asr:
  local_device: auto      # auto / cpu
  local_compute: int8     # int8 / int8_float16 / float16

# 字幕烧录样式（ratio 均为相对视频尺寸的比例，自动适配竖屏/横屏）
subtitle:
  enabled: true
  # 字体在本机不存在时会自动回退（PingFang SC → Hiragino Sans GB → Heiti SC）
  font: PingFang SC
  font_size_ratio: 0.045  # 字号 = 视频宽 * 0.045
  outline_ratio: 0.006    # 描边宽度
  margin_v_ratio: 0.07    # 距底部距离 = 视频高 * 0.07
  bold: true

# 二创变换（抖音「原创性不足」对策）
# 平台查重比对画面帧特征 + 音频波形 + 关键帧哈希。只转码+去元数据时
# 成片逐像素等于源片，判搬运一眼的事。开启后每条片子按下面区间随机取值，
# 参数独立 —— 固定模板批量产出反而会被判「同质化发布」。
transform:
  enabled: true
  crop_pct: [0.02, 0.05]     # 四边裁切比例（改构图，同时改帧哈希）
  zoom_pct: [1.02, 1.06]     # 放大后裁回原尺寸
  hflip_prob: 0.0            # 水平镜像概率（0 = 关闭：镜像后文字反着看很怪，2026-10-03 应要求停用）
  hue_deg: [-4.0, 4.0]       # 色相偏移（度）
  sat: [0.96, 1.06]
  bright: [-0.03, 0.03]
  contrast: [0.97, 1.05]
  fps: [29.5, 30.0]          # 微改帧率，打乱关键帧抽取
  tempo: [0.97, 1.03]        # 语速/音调微调（音频指纹，±3% 听不出）
  crf: [19, 24]              # 码率随机，避免固定编码指纹

# AI 画面质检开关
# 2026-09-16 起改为「手动发链接」模式：素材由人工筛选，真人检测已无必要。
# real_person_check: false = 完全停用真人检测（发现层不再丢弃真人候选、
#                            转码层不再跳过真人镜头），视频照常走完流水线。
# real_person_check: true  = 恢复真人检测（上方 discovery.filters.reject_real_person
#                            也需为 true 才会在发现层生效）。
vision:
  real_person_check: false

# 水印擦除（烧录在画面像素里的固定位置水印，用 ffmpeg delogo 取周边像素插值填充）
# 注意：只能擦固定位置水印；delogo 需重编码视频，画质有轻微损失。
# 坐标 [x, y, w, h]：数值全 <=1 视为相对比例（推荐，自动适配任意分辨率）。
watermark:
  enabled: false          # 默认关闭；确认素材确实带烧录水印再打开
  box: 1                  # delogo 采样边框宽度，1 最轻、越大越糊
  presets: []             # 预置区域：top_left / bottom_right / corner_pair / douyin
  # 自定义区域（与 presets 叠加生效）
  regions: []
  # 示例（左上角圆形 Logo + 右下角账号名水印，IMILASHA 这类素材的典型布局）：
  # presets: ["corner_pair"]

# 发布节奏（窗口全局；每日上限和最小间隔按平台独立计算，互不影响）
# 2026-11-02 回退（数据：19-22 点满 48h 样本 n=10 中位 248，10-18 点 n=35 中位 660；
# 改动后中位 928→279）。6 条挤 2.5 小时同账号自相竞争、流量池被分摊；
# 恢复全天分散 + 2 小时间隔（10/12/14/16/18/20 六条）。
publish:
  headless: true            # 后台无头浏览器；首次调试发布流程建议改 false 观察操作
  daily_limit: 6            # 每个平台每天最多发布条数（间隔 2h，全天分散）
  min_gap_hours: 2          # 同一平台两次发布之间的最小间隔（小时）
  window: ["10:00", "22:00"] # 允许发布的时间窗口，窗口外排队等待（支持跨夜，如 ["20:00","06:00"]）

# 发布平台开关。新平台先 python -m bot.main --login <平台> 扫码登录，再把 enabled 改 true
platforms:
  kuaishou:
    enabled: true
    # 自动素材发现（2026-11-09）：替代人工投链。
    # 只发现「链接」，候选仍走原有流水线（去重 → 下载 → 转码 → 文案 → 发布），
    # 不另造一套下载逻辑。
    discover:
      enabled: true
      interval_hours: 6
      per_query: 8
      per_run: 8
      sources: [youtube]        # IG 发现需 sessionid，当前无（见 bot/source/discover.py）
      # 同样必须带 #shorts：不带后缀返回的是长片/纪录片，会被时长闸门丢掉。
      queries:
        - "funny animal animation #shorts"
        - "cute pet fail #shorts"
        - "ai animated short funny #shorts"
        - "萌宠 搞笑 动画"
      # A 号是搞笑/萌宠号，不限题材，只排除明显不符的
      require_any: []
      block_any: [makeup tutorial, cooking recipe, news report]
    # 2026-11-02 星火下架（收益过低），改挂「作者服务」推广：
    #   主营业务 = 关联推广任务（星任务/短剧 CPS），发布页实时选任务，无需 App 收藏；
    #   池空/失败时兜底挂关联商品（日用百货 CPS，佣金低但稳定）；
    #   挂载失败软降级（记日志照常发布），不用再担心硬阻断。
    # 关掉推广挂载：attach_service 留空即可。
    attach_service: "关联推广任务"
    attach_prefer: "短剧"        # 短剧 CPS 单价最高，受众（家庭主妇）重合度最高
    attach_fallback: "关联商品"
    cover_title: false           # 2026-11-02 关闭 A 号封面大字报（与窗口同批上线无法归因，先撤）
    spark_task: false            # 星火已下架；留着字段便于日后星火恢复
    # spark_task_title 留空 = 按收益加权轮换（权重见 bot/publish/kuaishou.py
    # 的 SPARK_TASK_WEIGHTS）；填子串 = 固定只挂该任务
    # 收益归因报告：python -m bot.monitor.spark_income --report
    anchors:
      热点: "治愈"
      地点: "郴州"
      声明: "内容由AI生成"        # 作者声明；下拉若为「内容为AI生成」亦匹配

  # 第二个快手号（矩阵号）：链接里写 @快手2 才发（不进默认队列）。
  # 登录：/login 快手2（或 /login kuaishou2）→ TG 推扫码，登录态 ks2_state.json。
  # 星火池/收益快照按号独立文件，与上面 A 号互不影响。
  # 标题/话题按画面自适应（bot/ai/copywriter.py 的 kuaishou2 profile）。
  kuaishou2:
    enabled: true
    default: false              # 只有显式 @快手2 才发，绝不占默认队列
    # 自动素材发现：B 号是家居号，**必须做题材过滤**。
    # 2026-11-09 真实数据：10-24~11-02 床品占 71%，11-03 之后掉到 45%，
    # 修眉/女鞋/电竞房混进来 27%。人工挑会漂，这里用关键词挡在入库之前。
    discover:
      enabled: true
      interval_hours: 6
      per_query: 8
      per_run: 6
      sources: [youtube]
      # 查询词必须带 #shorts 或 short —— 实测不带后缀时 YouTube 返回的多是
      # 5~25 分钟的教程/测评（2026-11-09 诊断：6 条里 5 条时长 500s+ 被丢），
      # 带 #shorts 后 8 条里 5 条是 20 秒内的竖屏短视频。
      # 中文查询反而最准（「四件套 床品 卧室」6 条全过），保留。
      queries:
        - "cozy bedroom decor #shorts"
        - "fluffy bedding duvet #shorts"
        - "bedroom makeover #shorts"
        - "home bedding aesthetic #shorts"
        - "四件套 床品 卧室"
        - "床上用品 开箱 展示"
      # 标题/描述必须命中其一 —— 这是 B 号的题材闸门
      require_any:
        - bed
        - bedding
        - duvet
        - blanket
        - pillow
        - sheet
        - mattress
        - quilt
        - comforter
        - bedroom
        - sofa
        - cushion
        - rug
        - curtain
        - pyjama
        - pajama
        - 四件套
        - 床品
        - 毛绒
        - 被
        - 枕
        - 床单
        - 卧室
      # 命中即丢弃，优先级高于 require_any。
      # 用途：挡住「在卧室里化妆」这类 require 会命中、但题材完全不相关的内容。
      block_any:
        - makeup
        - eyebrow
        - skincare
        - gaming room
        - gaming setup
        - pc build
        - minecraft
        - 修眉
        - 化妆
        - 护肤
        - 电竞
        - 游戏
    daily_limit: 6              # 与 A 号相同节奏（间隔 2h，全天分散）
    min_gap_hours: 2            # 覆盖全局，与 A 号一致
    # 2026-11-09 起：**取消全部变现挂载**（用户要求）。
    #   attach_service / attach_prefer / attach_fallback 全部留空 = 发布页不挂任何
    #   「作者服务」（推广任务/商品都不挂），spark_task 也保持 false。
    #   代码侧判定：attach_service 为空且 spark_task 为 false → 整段挂载逻辑跳过，
    #   不会去点任何下拉（见 bot/publish/kuaishou.py 的 attach_service 分支）。
    #   日后要恢复：把 attach_service 填回 "关联推广任务" 即可。
    attach_service: ""
    attach_prefer: ""
    attach_fallback: ""
    cover_title: false
    spark_task: false           # 星火已下架；留字段便于日后恢复
    anchors:
      热点: "治愈"
      地点: "郴州"
      声明: "内容由AI生成"
  douyin:
    enabled: false
    # 发布时自动挂载「添加标签」（留空则跳过）。
    # 2026-09-22 改版：添加标签是搜索框，直接搜全国可挂的商品（不绑门店）。
    # 类型「商品/团购/标记万物」走搜索框；「位置」仍走旧下拉（门店，不全国）。
    anchors:
      商品: "抽纸"              # 全国日用商品；auto/全国 也会落到抽纸
      # 位置: "上海"           # 门店推广，绑定本地，不用
      # 小程序: "sslocal://..."
    hot_topic: "搞笑"          # 关联热点：自动搜该词并选第一个热点
  xhs:
    enabled: false   # 账号风控被限制发布，暂停；解封后改回 true
  weixin:
    enabled: false    # 2026-10-12 再次暂停：上传 300001 风控复发（10-10 恢复后发了 6 条），待解除后改回 true
  toutiao:
    enabled: true      # 可用，但**不默认发布**：链接里写 @头条/@toutiao 才发
    default: false     # 2026-10-15 起：按需投，不占默认队列
    anchors:
      声明: "AI生成"  # 素材是 AI 动画；页面文案就是「AI生成」

  # ============================================================
  # Instagram 矩阵号（出海线）：走 Meta 官方 Graph API，不用 Playwright。
  # 与国内平台的关键差异：
  #   1. 没有独立标题字段，caption 第一行就是钩子（见 ai/copywriter 的 ig_* profile）；
  #   2. 视频必须公网可访问（Meta 自己来拉），由协调端的 /api/media-url 出签名直链；
  #   3. 凭据在 .env：IG_TOKEN_<KEY> / IG_USERID_<KEY>，没有扫码登录态文件。
  #
  # default 必须 false —— 只有链接里显式 @ig萌宠 这类才发。
  # 否则任何没写平台名的链接会同时发到 IG，把国内素材误发到海外账号。
  #
  # 节奏（新号冷启动，2026-11-09 起）：
  #   日限 2 条、间隔 6 小时：新号猛发是最高危的封号行为，
  #   每天 1~2 条持续 2 周，比一天 5 条安全得多。
  # ============================================================
  ig_pets:
    enabled: true
    default: false
    share_to_feed: true
    is_ai_generated: false  # 萌宠素材多为实拍/拟真动画，不声明 AI
    daily_limit: 2
    min_gap_hours: 6
    window: ["20:00", "06:00"]   # 跨夜：覆盖欧美午后到晚间黄金时段
  ig_satisfying:
    enabled: true
    default: false
    share_to_feed: true
    is_ai_generated: false
    daily_limit: 2
    min_gap_hours: 6
    window: ["20:00", "06:00"]   # 跨夜：覆盖欧美午后到晚间黄金时段
  ig_anim:
    enabled: true
    default: false
    share_to_feed: true
    is_ai_generated: true   # 3D/AI 动画，Meta 要求自我披露
    daily_limit: 2
    min_gap_hours: 6
    window: ["20:00", "06:00"]   # 跨夜：覆盖欧美午后到晚间黄金时段
  ig_home:
    enabled: true
    default: false
    share_to_feed: true
    is_ai_generated: false
    daily_limit: 2
    min_gap_hours: 6
    window: ["20:00", "06:00"]   # 跨夜：覆盖欧美午后到晚间黄金时段

# 各平台可选分区列表（发布页有分区选择的平台才需要；抖音/小红书无分区，用话题标签）
# LLM 会从中选择一个；列表与实际不符时自动降级为不选分类
platform_categories:
  kuaishou:
    # 按目标人群（家庭主妇）关注度排序：靠前的更可能被 LLM 选中
    # （2026-10-29 曾按实测播放改为情感/萌宠优先，与窗口改动同批无法归因，
    #  2026-11-02 随标题一起回退基线）
    - 生活记录
    - 情感
    - 亲子
    - 美食
    - 搞笑
    - 健康
    - 教育
    - 萌宠
    - 三农
    - 知识
    - 影视娱乐
  # 快手2号（女性生活号）：分区按女性内容排（时尚置前；
  # 实际页面若无「时尚」选项，_select_category 失败不阻断，自动跳过）
  kuaishou2:
    - 时尚
    - 生活记录
    - 情感
    - 亲子
    - 美食
    - 知识
    - 旅游
    - 音乐
    - 时尚穿搭
    - 舞蹈
    - 游戏
    - 运动
    - 汽车
    - 科技数码
    - 二次元
