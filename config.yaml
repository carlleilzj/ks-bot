# ============================================================
# 非敏感配置。敏感信息（token/key）请写在 .env 里。
# ============================================================

# 轮询 Instagram 新作品的间隔（分钟）。官方 API 无风控压力，可适当调小
poll_interval_min: 15

# 本地 faster-whisper 附加选项（ASR_PROVIDER=local 时生效）
asr:
  local_device: auto      # auto / cpu
  local_compute: int8     # int8 / int8_float16 / float16

# 字幕烧录样式（ratio 均为相对视频尺寸的比例，自动适配竖屏/横屏）
subtitle:
  enabled: true
  # 字体在本机不存在时会自动回退（PingFang SC → Hiragino Sans GB → Heiti SC）
  font: PingFang SC
  font_size_ratio: 0.045  # 字号 = 视频宽 * 0.045
  outline_ratio: 0.006    # 描边宽度
  margin_v_ratio: 0.07    # 距底部距离 = 视频高 * 0.07
  bold: true

# AI 画面质检开关
# 2026-09-16 起改为「手动发链接」模式：素材由人工筛选，真人检测已无必要。
# real_person_check: false = 完全停用真人检测（发现层不再丢弃真人候选、
#                            转码层不再跳过真人镜头），视频照常走完流水线。
# real_person_check: true  = 恢复真人检测（上方 discovery.filters.reject_real_person
#                            也需为 true 才会在发现层生效）。
vision:
  real_person_check: false

# 水印擦除（烧录在画面像素里的固定位置水印，用 ffmpeg delogo 取周边像素插值填充）
# 注意：只能擦固定位置水印；delogo 需重编码视频，画质有轻微损失。
# 坐标 [x, y, w, h]：数值全 <=1 视为相对比例（推荐，自动适配任意分辨率）。
watermark:
  enabled: false          # 默认关闭；确认素材确实带烧录水印再打开
  box: 1                  # delogo 采样边框宽度，1 最轻、越大越糊
  presets: []             # 预置区域：top_left / bottom_right / corner_pair / douyin
  # 自定义区域（与 presets 叠加生效）
  regions: []
  # 示例（左上角圆形 Logo + 右下角账号名水印，IMILASHA 这类素材的典型布局）：
  # presets: ["corner_pair"]

# 发布节奏（窗口全局；每日上限和最小间隔按平台独立计算，互不影响）
publish:
  headless: true            # 后台无头浏览器；首次调试发布流程建议改 false 观察操作
  daily_limit: 5            # 每个平台每天最多发布条数
  min_gap_hours: 2          # 同一平台两次发布之间的最小间隔（小时）
  window: ["10:00", "22:00"] # 允许发布的时间窗口，窗口外排队等待（支持跨夜，如 ["20:00","06:00"]）

# 发布平台开关。新平台先 python -m bot.main --login <平台> 扫码登录，再把 enabled 改 true
platforms:
  kuaishou:
    enabled: true
    spark_task: true            # 发布时挂星火「关联变现任务」（需先在 App 收藏任务）
    # spark_task_title 留空 = 任务间轮换（round-robin）；填子串 = 固定优先
    anchors:
      热点: "治愈"
      地点: "郴州"
      声明: "内容由AI生成"        # 作者声明；下拉若为「内容为AI生成」亦匹配
  douyin:
    enabled: true
    # 发布时自动挂载「添加标签」（留空则跳过）。
    # 2026-09-22 改版：添加标签是搜索框，直接搜全国可挂的商品（不绑门店）。
    # 类型「商品/团购/标记万物」走搜索框；「位置」仍走旧下拉（门店，不全国）。
    anchors:
      商品: "抽纸"              # 全国日用商品；auto/全国 也会落到抽纸
      # 位置: "上海"           # 门店推广，绑定本地，不用
      # 小程序: "sslocal://..."
    hot_topic: "搞笑"          # 关联热点：自动搜该词并选第一个热点
  xhs:
    enabled: false   # 账号风控被限制发布，暂停；解封后改回 true
  weixin:
    enabled: false   # 默认关闭，只有投链时 @视频号 才发

# 各平台可选分区列表（发布页有分区选择的平台才需要；抖音/小红书无分区，用话题标签）
# LLM 会从中选择一个；列表与实际不符时自动降级为不选分类
platform_categories:
  kuaishou:
    # 按目标人群（家庭主妇）关注度排序：靠前的更可能被 LLM 选中
    - 生活记录
    - 情感
    - 亲子
    - 美食
    - 搞笑
    - 健康
    - 教育
    - 萌宠
    - 三农
    - 知识
    - 影视娱乐
    - 旅游
    - 音乐
    - 时尚穿搭
    - 舞蹈
    - 游戏
    - 运动
    - 汽车
    - 科技数码
    - 二次元

# ============================================================
# 发现层：主动采集热门动画短视频，发 TG 审核后再进流水线
# ============================================================
discovery:
  enabled: true           # 默认关闭；改为 true 才启动发现层
  interval_min: 60        # 每轮发现的间隔（分钟）
  limit_per_source: 20   # 每个适配器每轮最多取多少条候选
  max_pending_review: 10  # 待审核堆积上限，超过暂停发现（避免 TG 刷屏）

  filters:
    min_duration: 5       # 短视频最短时长（秒）
    max_duration: 320     # AI 动物剧情动画多为 1-5 分钟；>320s 是长合集，排除
    min_score: 1000       # 热度阈值（YouTube view_count；频道页/RSS 用发布顺序近似）
    keyword_whitelist: ["ai", "animal", "cat", "dog", "puppy", "kitten", "animated", "animation", "3d", "cgi", "pixar", "story"]
    keyword_blacklist: ["reaction", "recap", "compilation", "full episode", "how to make", "tutorial", "podcast", "mukbang"]
    # 封面 AI 质检：一次 vision 调用判三项——真人/水印/是否动画。
    # 2026-09-16 起改为手动发链接模式，真人检测已由下方 vision.real_person_check
    # 统一关闭；此开关保留但不再产生真人拦截（水印/动画判定同样受总开关控制）。
    # 需在 .env 配 VISION_MODEL（gemini-2.5-flash 已实测可用；grok 全系不支持图片输入）
    # 注：键名沿用 reject_real_person（历史原因），实际含义见上
    reject_real_person: true

  sources:
    # YouTube 关键词搜索：对准「AI 生成 3D 动物剧情/搞笑动画」赛道
    - type: youtube_search
      queries:
        - "ai cats story animation"
        - "ai animal rescue story animated"
        - "funny animal ai animation short"
        - "ai generated animal short film"
    # YouTube 频道订阅：AI 动物剧情动画高产频道（走 yt-dlp 频道页，tab=shorts 取短视频）
    - type: youtube_channel
      tab: shorts
      channels:
        - UC3HP8a40b5n_WXot8qAHe5w   # mini meownmeow（AI 猫咪变装/剧情，11万粉）
        - UC-T_MoYrpZt-qwn2vFK81uQ   # Meow Patrol Force（AI 猫咪剧情，2.3万粉）
        - UCV17hLOXd76ovdaYClpUd_A   # Ginger's Daily Meow（AI 猫妈妈故事）
        - UC20ckSa1wPc8alZYqkt9muA   # Mama Cat Story（AI 猫咪旅行/剧情）
        - UCNrt_21RJZw1EPxRpNBvt8w   # Cozy Catmeow（AI 猫狗暖心故事）
