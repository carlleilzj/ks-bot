name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          # 装 playwright 浏览器系统依赖 + 二进制（test_core import publish.* 会触发 playwright 包）
          playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check bot/ tests/

      - name: Test (pytest)
        env:
          # 测试里用本地时区判断发布窗口，统一时区避免 CI 时区差异导致 flaky
          TZ: Asia/Shanghai
        run: pytest tests/ -v --tb=short 2>&1 | tee pytest-output.txt

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

  # 依赖漏洞扫描：pip-audit 查 PyPI 已知 CVE
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies (requirements.txt)
        run: pip-audit -r requirements.txt

  # 硬编码密钥扫描：gitleaks 扫已提交代码里的真实 token/key
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks 需要完整历史扫描

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
