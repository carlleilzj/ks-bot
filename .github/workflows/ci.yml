name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          # 装 playwright 浏览器系统依赖 + 二进制（test_core import publish.* 会触发 playwright 包）
          playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check bot/ tests/

      - name: Test (pytest)
        env:
          # 测试里用本地时区判断发布窗口，统一时区避免 CI 时区差异导致 flaky
          TZ: Asia/Shanghai
        run: pytest tests/ -v
