[project]
name = "ks-bot"
version = "0.2.0"
description = "投链/发现层驱动的多平台发布 bot（下载 / AI 文案+字幕 / 快手抖音小红书视频号 / TG 审核通知）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 本地语音识别（ASR_PROVIDER=local 时需要）
local-asr = ["faster-whisper>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.monitor", "bot.media", "bot.ai", "bot.publish", "bot.notify", "bot.source", "bot.maintenance"]
